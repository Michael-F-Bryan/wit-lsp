tree-sitter          = { workspace = true }
wit-compiler         = { path = "../wit-compiler", version = "0.2.0" }
wit-language-server  = { path = "../wit-language-server", version = "0.2.0" }

[build-dependencies]
build-info-build = { workspace = true }
